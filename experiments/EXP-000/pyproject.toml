[project]
name = "exp000-scrub"
version = "0.1.0"
description = "EXP-000 PII scrubber, run locally on the researcher's machine"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "openpyxl>=3.1",
    "psycopg[binary]>=3.1",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
