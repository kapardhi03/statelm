# Copy to extract.yaml and fill in from the --inspect output.
# Every field below is required; a column that does not exist is an error, not a guess.
# For data spread across joined tables, create a view in PostgreSQL and point at the view.
sources:
  - table: public.messages
    columns:
      conversation_id: conversation_id
      speaker: sender_name
      speaker_role: sender_type
      timestamp: created_at
      text: body
    # Optional. Maps the values in your speaker_role column onto bot / agent / customer.
    # Unmapped values pass through unchanged and show up in the per-role counts.
    role_map:
      user: customer
      staff: agent
      automation: bot
      # outbound: CONFIRM_BOT_OR_AGENT   # replace: only you know which side this is

    # Optional. Each message kind needs exactly one disposition; an unclassified kind that
    # appears in the data fails the run rather than being guessed at. The placeholder
    # substitution is done in SQL, so a non-text body is never transmitted to this process.
    kinds:
      column: kind
      text: [text]
      placeholder:
        audio: "[media: voice note]"
        image: "[media: image]"
      drop: [reaction]

    # Optional. These columns must never appear in any statement. A column that is both
    # excluded and mapped is a config error, not a silent precedence rule.
    exclude: [intent, meta]
