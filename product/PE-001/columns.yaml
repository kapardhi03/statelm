# PE-001: which column of the labelling sheet holds which logical field.
#
# Filled in from Kapardhi's answers of 2026-11-09 and 2026-11-12: the sheet has conversation_id,
# user_message, action and reply, and he is adding labeler and item_id before re-exporting.
#
# Header names are not client text, so this file is safe to commit, and committing it is how a run
# stays reproducible: its hash goes into config.json.

# --- required -------------------------------------------------------------------------------------
conversation_id: conversation_id
user_message: user_message
action: action

# --- optional, present -----------------------------------------------------------------------------
reply: reply

# Added to the sheet on 2026-11-12. Without it Gate 1 condition 4 fails: `data-and-splits.md`
# requires a labeler on every record, and his Q1(b) answer ("i labelled them myself, no model
# involved") establishes it for the corpus but not row by row. One value filled down is enough.
# Its value never leaves the machine: PE-001 reports only `missing_labeler` and `labeler_coverage`.
labeler: labeler

# Added to the sheet on 2026-11-12. Without it ids become `row-<n>`, stable only while the export's
# row order is, which makes the EXP-000 pilot-overlap check and the re-label answer key fragile
# across a re-sort or re-export. The value must be FROZEN, not a live formula — see the run book.
item_id: item_id

# --- optional, still absent -------------------------------------------------------------------------
#
# turn_index: not in the sheet.
#   Turn order falls back to the export's row order, and config.json records
#   `turn_order_from: export_row_order` so a reader knows "earlier in the conversation" is an
#   assumption about the export rather than a fact. Measurements D and G both depend on that order.
#   Worth adding in the same pass if the sheet is already in turn order: a per-conversation 1, 2,
#   3... frozen the same way as item_id.
